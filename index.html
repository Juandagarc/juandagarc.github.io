<style>
  :root {
    color-scheme: dark;
    --ground: #030407;
    --ink: #ECEEF2;
    --ink-2: #C5CAD4;
    --muted: #8A90A0;
    --line: rgba(236, 238, 242, .13);
    --line-2: rgba(236, 238, 242, .26);
    --panel: rgba(7, 8, 13, .58);
    --cyan: #5FE8FF;
    --violet: #8C7BFF;
    --pink: #F27BFF;
    --iri: linear-gradient(100deg, #5FE8FF 0%, #8C7BFF 45%, #F27BFF 78%, #9FF3FF 100%);
    --f-body: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --f-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --ease: cubic-bezier(.2, .75, .2, 1);
    --gutter: clamp(16px, 6vw, 96px);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--ground); }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--f-body);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  ::selection { background: var(--violet); color: #fff; }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
  .iri { background: var(--iri); -webkit-background-clip: text; background-clip: text; color: transparent; }
  button { font: inherit; color: inherit; }

  /* ---------- canvas ---------- */
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
  .no-webgl #scene { display: none; }
  .no-webgl body, .no-webgl { background: radial-gradient(120% 80% at 70% 30%, #151a2e 0%, var(--ground) 60%); }

  /* ---------- loader ---------- */
  #loader {
    position: fixed; inset: 0; z-index: 60; background: var(--ground);
    display: grid; place-items: center;
    transition: opacity 1s var(--ease), visibility 1s;
    animation: failsafe 0s 14s forwards;
  }
  #loader.done { opacity: 0; visibility: hidden; }
  @keyframes failsafe { to { opacity: 0; visibility: hidden; } }
  .loader-inner { width: min(340px, calc(100% - 32px)); display: grid; gap: 14px; }
  .loader-kicker { font: 500 11px/1 var(--f-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
  .loader-title { font-weight: 800; font-size: 30px; line-height: 1.05; letter-spacing: -.02em; margin: 0; }
  .loader-bar { height: 1px; background: var(--line); position: relative; overflow: hidden; }
  .loader-bar i { position: absolute; inset: 0; background: var(--iri); transform-origin: 0 50%; transform: scaleX(0); transition: transform .4s var(--ease); }
  .loader-pct { font: 500 12px/1 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ---------- top bar ---------- */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) clamp(16px, 3vw, 36px) 14px;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(3, 4, 7, .7), rgba(3, 4, 7, 0));
  }
  .topbar > * { pointer-events: auto; }
  .brand { display: inline-flex; align-items: baseline; gap: 6px; color: var(--ink); text-decoration: none; font-weight: 800; font-size: 17px; letter-spacing: -.01em; }
  .brand-mark { font: 500 14px/1 var(--f-mono); color: var(--muted); }
  .now { display: none; font: 500 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); gap: 8px; }
  .now b { color: var(--muted); font-weight: 500; }
  .tools { display: flex; align-items: center; gap: 8px; }
  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 999px; padding: 2px; background: rgba(11, 12, 15, .4); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .seg button { border: 0; background: transparent; cursor: pointer; font: 500 11.5px/1 var(--f-mono); letter-spacing: .08em; padding: 8px 10px; border-radius: 999px; color: var(--muted); transition: background .25s, color .25s; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--ground); }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px;
    border: 1px solid var(--line-2); border-radius: 999px; background: rgba(11, 12, 15, .4);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    font: 500 11.5px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); cursor: pointer;
    transition: border-color .25s, color .25s;
  }
  .chip:hover { border-color: var(--ink); color: var(--ink); }
  .chip svg { width: 16px; height: 16px; flex: none; }
  .chip .bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
  .chip .bars i { width: 2px; height: 4px; background: currentColor; border-radius: 1px; }
  .chip[aria-pressed="true"] .bars i { animation: eq 1s ease-in-out infinite; }
  .chip[aria-pressed="true"] .bars i:nth-child(2) { animation-delay: -.3s; }
  .chip[aria-pressed="true"] .bars i:nth-child(3) { animation-delay: -.6s; }
  @keyframes eq { 0%, 100% { height: 3px; } 50% { height: 12px; } }

  .progress { position: fixed; left: 0; right: 0; top: 0; height: 2px; z-index: 31; pointer-events: none; }
  .progress i { display: block; height: 100%; background: var(--iri); transform-origin: 0 50%; transform: scaleX(0); }

  /* ---------- floor plan ---------- */
  .plan {
    position: fixed; right: clamp(16px, 2.4vw, 36px); top: 50%; transform: translateY(-50%);
    z-index: 25; width: 64px;
  }
  .plan-title { font: 500 10px/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; text-align: right; white-space: nowrap; }
  .plan .rail { position: relative; }
  .plan ol { list-style: none; margin: 0; padding: 0; position: relative; display: grid; gap: 6px; }
  .plan ol::before { content: ""; position: absolute; right: 11px; top: 14px; bottom: 14px; width: 1px; background: var(--line-2); }
  .plan li button {
    display: grid; grid-template-columns: auto 24px; align-items: center; justify-items: end; gap: 10px; width: 100%;
    background: none; border: 0; padding: 6px 0; cursor: pointer; text-align: right; color: var(--muted);
    transition: color .3s; position: relative;
  }
  .plan li button .num { grid-column: 1; grid-row: 1; }
  .plan li button .shape { grid-column: 2; grid-row: 1; }
  .plan .name {
    position: absolute; right: 64px; top: 50%; transform: translate(6px, -50%); white-space: nowrap;
    padding: 5px 9px; border-radius: 999px; background: rgba(11, 12, 15, .72); border: 1px solid var(--line);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none; transition: opacity .3s, transform .4s var(--ease);
  }
  .plan li button:hover .name, .plan li button:focus-visible .name, .plan li button[aria-current="true"] .name { opacity: 1; transform: translate(0, -50%); }
  .plan li button:hover, .plan li button[aria-current="true"] { color: var(--ink); }
  .plan .shape { justify-self: center; background: var(--ground); border: 1px solid currentColor; position: relative; z-index: 1; }
  .plan .shape.sq { width: 12px; height: 12px; }
  .plan .shape.bar { width: 8px; height: 26px; }
  .plan .shape.ring { width: 18px; height: 18px; border-radius: 50%; }
  .plan .shape.dia { width: 12px; height: 12px; transform: rotate(45deg); }
  .plan .num { font: 500 10.5px/1 var(--f-mono); letter-spacing: .08em; font-variant-numeric: tabular-nums; }
  .plan .name { font-size: 13px; font-weight: 600; }
  .plan .visitor {
    position: absolute; right: 7px; top: 0; width: 9px; height: 9px; border-radius: 50%;
    background: var(--ink); box-shadow: 0 0 0 4px rgba(236, 238, 242, .12), 0 0 18px rgba(236, 238, 242, .6);
    z-index: 2; pointer-events: none; will-change: transform;
  }

  /* ---------- tour sections ---------- */
  #tour { position: relative; z-index: 2; pointer-events: none; }
  .stop { position: relative; min-height: 135vh; display: flex; align-items: center; padding-inline: var(--gutter); }
  .stop[data-side="right"] { justify-content: flex-end; }
  .stop.hero { min-height: 100vh; min-height: 100svh; align-items: flex-end; padding-block: 0 clamp(40px, 10vh, 104px); }
  .stop.hero::before { content: ""; position: absolute; inset: 45% 0 0 0; background: linear-gradient(180deg, rgba(3, 4, 7, 0), rgba(3, 4, 7, .7) 75%); pointer-events: none; }
  .hero-copy, .cue { position: relative; }
  .stop.last { min-height: 100vh; min-height: 100svh; }
  /* a row of laptops: the stop grows by 70vh per extra laptop and its panel stays centred while the camera walks the row */
  .stop.multi { min-height: calc(135vh + (var(--n) - 1) * 70vh); align-items: flex-start; padding-top: calc(67.5vh - var(--ph, 420px) / 2); }
  .stop.multi > .panel { position: sticky; top: calc(50vh - var(--ph, 420px) / 2); }
  @media (min-width: 900px) {
    .stop[data-side="right"] { padding-right: max(var(--gutter), 136px); }
  }

  .panel {
    pointer-events: auto; width: min(440px, 100%);
    background: var(--panel);
    -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3);
    border: 1px solid var(--line); border-radius: 3px;
    padding: 18px 22px 22px;
    box-shadow: 0 40px 90px -40px rgba(0, 0, 0, .8);
    will-change: opacity, transform;
  }
  .cat {
    display: flex; justify-content: space-between; gap: 12px;
    font: 500 11px/1.3 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
    padding-bottom: 12px; border-bottom: 1px solid var(--line);
  }
  .cat .inv { color: var(--ink-2); }
  .artist { margin: 14px 0 2px; font-size: 13px; color: var(--muted); font-weight: 500; }
  .panel h2 {
    margin: 0 0 12px; font-weight: 800; font-style: italic;
    font-size: clamp(28px, 3vw, 38px); line-height: 1.04; letter-spacing: -.025em; text-wrap: balance;
  }
  .panel h2.plain { font-style: normal; margin-top: 14px; }
  .panel p { margin: 0 0 10px; color: var(--ink-2); font-size: 15px; line-height: 1.62; max-width: 62ch; }
  .meta { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0 0 14px; font: 400 12.5px/1.45 var(--f-mono); }
  .meta dt { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: 10.5px; padding-top: 2px; }
  .meta dd { margin: 0; color: var(--ink); }
  .credit { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font: 500 10.5px/1.4 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }
  .who { display: grid; grid-template-columns: 76px 1fr; gap: 16px; align-items: end; margin: 14px 0 12px; }
  .who img { width: 76px; height: 101px; object-fit: cover; border: 1px solid var(--line-2); border-radius: 2px; display: block; }
  .who .artist { margin-top: 0; }
  .who h2 { margin-bottom: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px; }
  .chips span { font: 500 11px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--line-2); border-radius: 999px; padding: 6px 10px; color: var(--ink-2); }

  .rows { display: grid; gap: 0; margin: 4px 0 0; padding: 0; list-style: none; }
  .rows li { display: grid; grid-template-columns: 58px 1fr auto; gap: 12px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line); }
  .rows li:first-child { border-top: 0; }
  .rows .k { font: 500 12px/1 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .rows .v { font-weight: 600; font-size: 14.5px; line-height: 1.35; }
  .rows .v small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .rows .d { font: 500 12px/1 var(--f-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rows .bar { display: block; height: 3px; margin-top: 8px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .rows .bar i { display: block; height: 100%; background: var(--iri); border-radius: 2px; }
  .rows li.future .v { color: var(--ink-2); }
  .rows li.future .k::after { content: "*"; color: var(--cyan); }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px;
    border-radius: 999px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, .04); color: var(--ink);
    font: 600 14px/1 var(--f-body); text-decoration: none; cursor: pointer;
    transition: background .25s, border-color .25s, color .25s;
    will-change: transform;
  }
  .btn:hover { border-color: var(--ink); background: rgba(255, 255, 255, .08); }
  .btn.primary { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .btn.primary:hover { background: #fff; }
  .btn svg { width: 14px; height: 14px; }

  .links { display: grid; gap: 0; margin: 6px 0 0; padding: 0; list-style: none; }
  .links a { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); color: var(--ink); text-decoration: none; }
  .links li:first-child a { border-top: 0; }
  .links a span { font-weight: 700; font-size: 16px; }
  .links a small { font: 400 12px/1 var(--f-mono); color: var(--muted); }
  .links a:hover span { color: var(--cyan); }
  .tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; border: 1px solid rgba(95, 232, 255, .35); color: var(--cyan); background: rgba(95, 232, 255, .06); font: 500 10.5px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; }
  .badge { display: inline-flex; align-items: center; padding: 5px 10px; border-radius: 999px; font: 600 10.5px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ground); background: var(--iri); }
  .badge.live { background: none; color: #7CF0A6; border: 1px solid rgba(124, 240, 166, .45); }
  .badge.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #7CF0A6; margin-right: 7px; box-shadow: 0 0 8px #7CF0A6; }
  .stats { list-style: none; margin: 4px 0 14px; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stats li { display: grid; gap: 4px; padding: 10px 0 0; border-top: 1px solid var(--line-2); }
  .stats b { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .stats span { font-size: 12px; line-height: 1.35; color: var(--muted); }
  .panel.featured { border-color: rgba(140, 123, 255, .45); box-shadow: 0 0 0 1px rgba(95, 232, 255, .08), 0 40px 90px -40px rgba(140, 123, 255, .45); }
  .note { align-self: center; font: 500 11px/1.4 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .panel .lead { color: var(--ink); font-size: 14.5px; margin: 14px 0 0; padding-left: 12px; border-left: 2px solid var(--violet); }
  .works { list-style: none; margin: 4px 0 0; padding: 0; display: grid; }
  .works li { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; border-top: 1px solid var(--line); }
  .works li:first-child { border-top: 0; }
  .work { display: grid; gap: 3px; text-align: left; background: none; border: 0; padding: 11px 0; cursor: pointer; color: var(--ink); }
  .work .w-name { font-weight: 700; font-size: 15.5px; }
  .work .w-meta { font: 400 11.5px/1.3 var(--f-mono); color: var(--muted); }
  .work:hover .w-name { color: var(--cyan); }
  .works li { position: relative; }
  .works li::before { content: ""; position: absolute; left: -14px; top: 12px; bottom: 12px; width: 2px; border-radius: 2px; background: var(--iri); opacity: 0; transform: scaleY(.3); transition: opacity .35s, transform .45s var(--ease); }
  .works li[data-current]::before { opacity: 1; transform: none; }
  .works li[data-current] .w-name { color: var(--cyan); }
  .w-link { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink-2); }
  .w-link:hover { border-color: var(--ink); color: var(--ink); }
  .w-link svg { width: 14px; height: 14px; }
  .ficha-card { display: grid; place-items: center; align-content: center; gap: 10px; width: 100%; height: 100%; text-align: center; }
  .ficha-card strong { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
  .ficha-card span { font: 500 11px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .fineprint { margin: 12px 0 0; font-size: 11.5px; line-height: 1.5; color: var(--muted); }
  .fineprint a { color: inherit; text-decoration: none; }
  .fineprint a:hover { color: var(--ink-2); text-decoration: underline; }
  .fineprint + .fineprint { margin-top: 6px; }

  /* ---------- hero ---------- */
  .hero-copy { pointer-events: auto; max-width: 1040px; }
  .eyebrow { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; font: 500 11.5px/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); }
  .eyebrow::before { content: ""; width: 28px; height: 1px; background: var(--ink-2); }
  .hero h1 { margin: 0; font-weight: 800; font-size: clamp(42px, 6.6vw, 92px); line-height: .96; letter-spacing: -.04em; text-wrap: balance; }
  .hero h1 span { display: inline-block; }
  .hero h1 .iri { padding-right: .04em; }
  .hero-sub { margin: 20px 0 0; max-width: 50ch; color: var(--ink-2); font-size: clamp(15px, 1.25vw, 17px); line-height: 1.6; }
  .cue { position: absolute; right: var(--gutter); bottom: clamp(40px, 10vh, 104px); display: flex; align-items: center; gap: 12px; font: 500 11px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .cue i { position: relative; width: 1px; height: 44px; background: var(--line-2); overflow: hidden; }
  .cue i::after { content: ""; position: absolute; left: 0; top: -40%; width: 1px; height: 40%; background: var(--ink); animation: drip 2.2s var(--ease) infinite; }
  @keyframes drip { to { top: 100%; } }
  .booted .hero .reveal { animation: rise 1.1s var(--ease) both; }
  .booted .hero .reveal:nth-child(2) { animation-delay: .12s; }
  .booted .hero .reveal:nth-child(3) { animation-delay: .24s; }
  @keyframes rise { from { transform: translateY(18px); opacity: .001; } }

  /* ---------- ficha (project sheet) ---------- */
  dialog#ficha, dialog#cf-dialog {
    position: fixed; inset: 0 0 0 auto; margin: 0; width: min(500px, 100%); height: 100%; max-height: 100%; max-width: 100%;
    padding: 0; border: 0; border-left: 1px solid var(--line);
    background: rgba(10, 11, 14, .88); color: var(--ink);
    -webkit-backdrop-filter: blur(22px) saturate(1.2); backdrop-filter: blur(22px) saturate(1.2);
    overflow-y: auto; overscroll-behavior: contain;
  }
  dialog#ficha[open], dialog#cf-dialog[open] { animation: slidein .6s var(--ease); }
  @keyframes slidein { from { transform: translateX(40px); opacity: .001; } }
  dialog#ficha::backdrop, dialog#cf-dialog::backdrop { background: linear-gradient(90deg, rgba(0, 0, 0, 0) 30%, rgba(0, 0, 0, .35)); }
  .ficha-media { aspect-ratio: 16 / 10; max-width: 100%; background: radial-gradient(80% 90% at 50% 45%, #16193a, #030407); display: grid; place-items: center; border-bottom: 1px solid var(--line); padding: 18px; }
  .ficha-media img { width: 100%; height: 100%; object-fit: contain; }
  .ficha-body { padding: 20px 24px calc(28px + env(safe-area-inset-bottom, 0px)); }
  .ficha-close { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 12px; }
  /* contact form */
  .contact-form { padding: calc(env(safe-area-inset-top, 0px) + 64px) 24px calc(28px + env(safe-area-inset-bottom, 0px)); }
  .contact-form h2 { margin: 14px 0 8px; font-weight: 800; font-size: clamp(30px, 3vw, 40px); line-height: 1.04; letter-spacing: -.025em; }
  .contact-form .lead { margin: 0 0 22px; color: var(--ink-2); font-size: 15px; line-height: 1.6; }
  .field { display: grid; gap: 7px; margin: 0 0 14px; }
  .field > span { font: 500 10.5px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .field > span i { font-style: normal; text-transform: none; letter-spacing: 0; opacity: .75; }
  .field input, .field textarea {
    width: 100%; border: 1px solid var(--line-2); border-radius: 10px; background: rgba(255, 255, 255, .03); color: var(--ink);
    font: 400 15px/1.5 var(--f-body); padding: 11px 13px; transition: border-color .2s, background .2s, box-shadow .2s;
  }
  .field textarea { resize: vertical; min-height: 140px; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--cyan); background: rgba(95, 232, 255, .05); box-shadow: 0 0 0 3px rgba(95, 232, 255, .12); }
  .field [aria-invalid="true"] { border-color: #FF8FB0; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .contact-form .actions { margin-top: 6px; }
  .contact-form .btn[disabled] { opacity: .6; cursor: progress; }
  .cf-status { min-height: 1.5em; margin: 12px 0 0; font-size: 14px; line-height: 1.5; color: var(--ink-2); }
  .cf-status.ok { color: var(--cyan); }
  .cf-status.err { color: #FFB3C8; }
  .cf-direct { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 18px 0 0; padding-top: 14px; border-top: 1px solid var(--line); font: 400 12.5px/1.5 var(--f-mono); color: var(--muted); }
  .cf-direct a { color: var(--ink); user-select: all; -webkit-user-select: all; }
  .links button { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; width: 100%; padding: 12px 0; border: 0; border-top: 1px solid var(--line); background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
  .links button span { font-weight: 700; font-size: 16px; }
  .links button small { font: 400 12px/1 var(--f-mono); color: var(--muted); }
  .links button:hover span { color: var(--cyan); }
  @media (max-width: 760px) {
    dialog#ficha, dialog#cf-dialog { inset: auto 0 0 0; width: 100%; height: auto; max-height: 82vh; border-left: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; }
    dialog#ficha[open], dialog#cf-dialog[open] { animation-name: slideup; }
    dialog#cf-dialog { max-height: 92vh; }
    .contact-form { padding-top: 56px; }
    @keyframes slideup { from { transform: translateY(40px); opacity: .001; } }
    dialog#ficha::backdrop, dialog#cf-dialog::backdrop { background: linear-gradient(180deg, rgba(0, 0, 0, 0) 20%, rgba(0, 0, 0, .4)); }
    .ficha-media { aspect-ratio: 16 / 9; }
  }

  /* ---------- cursor ---------- */
  #cursor { position: fixed; left: 0; top: 0; width: 0; height: 0; z-index: 70; pointer-events: none; opacity: 0; transition: opacity .3s; }
  #cursor.on { opacity: 1; }
  #cursor .ring { position: absolute; left: -16px; top: -16px; width: 32px; height: 32px; border: 1px solid rgba(236, 238, 242, .55); border-radius: 50%; transition: transform .45s var(--ease), border-color .3s, background .3s; }
  #cursor .label { position: absolute; left: 24px; top: -11px; white-space: nowrap; font: 500 10.5px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; background: var(--ink); color: var(--ground); padding: 6px 9px; border-radius: 999px; opacity: 0; transform: translateX(-8px); transition: opacity .3s, transform .45s var(--ease); }
  #cursor.active .ring { transform: scale(1.7); border-color: var(--ink); background: rgba(236, 238, 242, .06); }
  #cursor.active.has-label .label { opacity: 1; transform: none; }
  @media (pointer: coarse) { #cursor { display: none; } }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .fallback-note { display: none; }
  .no-webgl .fallback-note { display: block; }

  /* ---------- small screens ---------- */
  @media (max-width: 899px) {
    .plan { display: none; }
    .now { display: inline-flex; }
  }
  @media (max-width: 760px) {
    /* a stop is 135vh tall and centred on screen, so its bottom sits 17.5vh below the fold */
    .stop { align-items: flex-end; padding-block: 0 calc(17.5vh + 3vh); }
    .stop.last { padding-block: 0 4vh; }
    .stop.multi { align-items: flex-end; padding-top: 0; }
    .stop.multi > .panel { top: auto; bottom: 3vh; }
    /* on phones a work's panel keeps to a short caption; the full text is in its sheet */
    .panel.showcase p:not(.lead):not(.artist):not(.badges) { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .panel.showcase p.lead { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .panel.showcase:has(.works) .credit { display: none; }
    .panel.showcase .meta { display: none; }
    /* the featured piece says it in figures; its description waits in the sheet */
    .panel.showcase.featured .stats ~ p:not(.lead):not(.artist) { display: none; }
    .stats { margin-bottom: 4px; }
    .stats b { font-size: 18px; }
    .stats span { font-size: 11px; line-height: 1.3; }
    .who { grid-template-columns: 56px 1fr; }
    .who img { width: 56px; height: 75px; }
    .stop[data-side="right"] { justify-content: flex-start; }
    .panel { width: 100%; padding: 16px 18px 18px; }
    .panel p { font-size: 14.5px; }
    .panel h2 { font-size: 28px; }
    .cue { display: none; }
    .brand { font-size: 15px; }
    .chip span.lbl { display: none; }
    .now { display: none; }
  }
  /* ---------- minigame ---------- */
  html.playing, html.playing body { overflow: hidden; }
  /* the tour's panels carry their own inline visibility, so the game hides them with !important */
  html.playing #tour, html.playing #tour *, html.playing .topbar, html.playing .topbar *, html.playing .plan, html.playing .plan *, html.playing .progress, html.playing #cursor { visibility: hidden !important; }
  #game { position: fixed; inset: 0; z-index: 50; cursor: none; touch-action: none; user-select: none; -webkit-user-select: none; outline: none; }
  .g-cross { position: fixed; left: 0; top: 0; width: 28px; height: 28px; margin: -14px 0 0 -14px; pointer-events: none; border: 1.5px solid rgba(236, 238, 242, .9); border-radius: 50%; box-shadow: 0 0 14px rgba(95, 232, 255, .55), inset 0 0 8px rgba(95, 232, 255, .35); }
  .g-cross::before, .g-cross::after { content: ""; position: absolute; left: 50%; top: 50%; background: var(--cyan); }
  .g-cross::before { width: 14px; height: 1.5px; margin: -.75px 0 0 -7px; }
  .g-cross::after { width: 1.5px; height: 14px; margin: -7px 0 0 -.75px; }
  .g-hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) clamp(16px, 3vw, 36px) 14px;
    background: linear-gradient(180deg, rgba(3, 4, 7, .78), rgba(3, 4, 7, 0)); cursor: default;
  }
  .g-name { margin: 0; font-weight: 800; font-style: italic; font-size: 18px; letter-spacing: -.01em; }
  .g-stats { display: flex; gap: clamp(14px, 3vw, 28px); margin: 0; }
  .g-stats div { display: grid; gap: 4px; }
  .g-stats dt { font: 500 10px/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .g-stats dd { margin: 0; font: 500 16px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
  .g-card {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(460px, calc(100% - 32px)); max-height: calc(100% - 140px); overflow: auto;
    background: var(--panel); -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3);
    border: 1px solid var(--line); border-radius: 3px; padding: 22px; cursor: default; box-shadow: 0 40px 90px -40px rgba(0, 0, 0, .8);
  }
  .g-card h2 { margin: 2px 0 8px; font-size: 32px; line-height: 1.05; font-style: italic; font-weight: 800; letter-spacing: -.02em; }
  .g-card p { margin: 0 0 10px; color: var(--ink-2); font-size: 15px; }
  .g-kicker { font: 500 11px/1 var(--f-mono) !important; letter-spacing: .16em; text-transform: uppercase; color: var(--muted) !important; }
  .g-keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 14px 0; font-size: 13.5px; align-items: center; }
  .g-keys dt, .g-keys dd { margin: 0; }
  .g-keys dd { color: var(--ink-2); }
  .g-keys kbd { font: 500 11.5px/1.7 var(--f-mono); color: var(--ink); background: rgba(236, 238, 242, .08); border: 1px solid var(--line-2); border-radius: 4px; padding: 1px 8px; white-space: nowrap; }
  .g-touchnote { display: none; font-size: 13.5px !important; }
  .g-result { font: 500 46px/1 var(--f-mono) !important; color: var(--ink) !important; margin: 12px 0 !important; font-variant-numeric: tabular-nums; }
  .g-card .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .g-touch { display: none; position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); padding-inline: 18px; justify-content: space-between; align-items: end; pointer-events: none; }
  .g-touch div { display: flex; gap: 12px; }
  .g-touch button {
    pointer-events: auto; width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--line-2); background: rgba(11, 12, 15, .5);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: var(--ink); font-size: 22px; touch-action: none;
  }
  .g-touch button:active { background: rgba(95, 232, 255, .25); }
  @media (pointer: coarse) {
    .g-touch { display: flex; }
    .g-cross { display: none; }
    #game { cursor: auto; }
    .g-touchnote { display: block; }
    .g-keys { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<canvas id="scene" aria-hidden="true"></canvas>

<div id="loader" role="status" aria-live="polite">
  <div class="loader-inner">
    <div class="loader-kicker"><span>Juandagarc</span><span>JDG · 2023 —</span></div>
    <p class="loader-title" id="loader-title">Cargando el portafolio</p>
    <div class="loader-bar"><i id="loader-bar"></i></div>
    <div class="loader-kicker"><span id="loader-sub">Polishing the glass</span><span class="loader-pct" id="loader-pct">0%</span></div>
  </div>
</div>

<div class="progress" aria-hidden="true"><i id="progress"></i></div>

<header class="topbar">
  <a class="brand" href="#entrance" data-goto="0"><span class="brand-mark">&lt;/&gt;</span>Juandagarc</a>
  <div class="now" id="now" aria-hidden="true"><b id="now-num">01</b><span id="now-name">Entrance</span></div>
  <div class="tools">
    <div class="seg" role="group" aria-label="Language / Idioma">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="es" aria-pressed="false">ES</button>
    </div>
    <button type="button" class="chip" id="sound" aria-pressed="false">
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="lbl" id="sound-label">Sound off</span>
    </button>
  </div>
</header>

<nav class="plan" id="plan" aria-label="Trayectoria"></nav>

<main id="tour"></main>

<dialog id="ficha" aria-labelledby="ficha-title">
  <div class="ficha-media"><img id="ficha-img" alt=""><div class="ficha-card" id="ficha-card" hidden></div></div>
  <button type="button" class="chip ficha-close" id="ficha-close">Esc · <span id="ficha-close-lbl">Close</span></button>
  <div class="ficha-body">
    <div class="cat"><span class="inv" id="ficha-inv"></span><span id="ficha-room"></span></div>
    <p class="artist" id="ficha-artist"></p>
    <h2 id="ficha-title"></h2>
    <dl class="meta" id="ficha-meta"></dl>
    <p id="ficha-desc"></p>
    <div class="actions">
      <a class="btn primary" id="ficha-link" href="#" target="_blank" rel="noopener"></a>
      <a class="btn" id="ficha-code" href="#" target="_blank" rel="noopener" hidden></a>
      <span class="note" id="ficha-note" hidden></span>
    </div>
    <div class="credit"><span id="ficha-credit"></span><span>Juandagarc</span></div>
  </div>
</dialog>

<div id="game" hidden tabindex="-1" role="application" aria-label="Minijuego">
  <div class="g-cross" id="g-cross" aria-hidden="true"></div>
  <header class="g-hud">
    <p class="g-name" id="g-name"></p>
    <dl class="g-stats">
      <div><dt id="g-l-bricks"></dt><dd id="g-bricks">00/00</dd></div>
      <div><dt id="g-l-time"></dt><dd id="g-time">00:00.0</dd></div>
      <div><dt id="g-l-best"></dt><dd id="g-best">—</dd></div>
    </dl>
    <button type="button" class="chip" id="g-exit"></button>
  </header>
  <section class="g-card" id="g-intro"></section>
  <section class="g-card" id="g-end" hidden></section>
  <div class="g-touch">
    <div><button type="button" data-k="left" aria-label="←">◀</button><button type="button" data-k="right" aria-label="→">▶</button></div>
    <div><button type="button" data-k="down" aria-label="↓ C">⤓</button><button type="button" data-k="jump" aria-label="↑">⤒</button></div>
  </div>
</div>

<dialog id="cf-dialog" aria-labelledby="cf-title">
  <button type="button" class="chip ficha-close" id="cf-close">Esc · <span id="cf-close-lbl">Close</span></button>
  <form class="contact-form" id="cf" novalidate>
    <div class="cat"><span class="inv">JDG-C02</span><span id="cf-kicker"></span></div>
    <h2 id="cf-title"></h2>
    <p class="lead" id="cf-lead"></p>
    <label class="field"><span id="cf-l-name"></span><input name="name" autocomplete="name" maxlength="80" required></label>
    <label class="field"><span id="cf-l-email"></span><input name="email" type="email" autocomplete="email" inputmode="email" maxlength="120" required></label>
    <label class="field"><span id="cf-l-subject"></span><input name="subject" maxlength="120"></label>
    <label class="field"><span id="cf-l-message"></span><textarea name="message" rows="6" maxlength="4000" required></textarea></label>
    <input class="hp" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="actions"><button type="submit" class="btn primary" id="cf-send"></button></div>
    <p class="cf-status" id="cf-status" role="status" aria-live="polite"></p>
    <p class="cf-direct"><span id="cf-direct"></span><a id="cf-mail" href="mailto:contact@juandagarc.com">contact@juandagarc.com</a><button type="button" class="chip" id="cf-copy"></button></p>
  </form>
</dialog>

<div id="cursor" aria-hidden="true"><div class="ring"></div><div class="label" id="cursor-label"></div></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
